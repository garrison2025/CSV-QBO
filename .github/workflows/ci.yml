name: Validate finance file site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run financial parsing and SEO safety gates
        run: npm run check
      - name: Ensure preview build remains noindex
        run: |
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
          test ! -f dist/sitemap.xml
      - name: Run real Chrome browser file-upload and download acceptance
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.55.0
          node tests/browser-e2e.mjs
      - name: Upload synthetic browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: browser-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 3
