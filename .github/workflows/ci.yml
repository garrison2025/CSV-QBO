name: Validate finance file site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run financial parsing and SEO safety gates
        run: npm run check
      - name: Validate reviewed bank UAT public ledger (empty until real evidence)
        run: npm run uat:check-public
      - name: Ensure preview build remains noindex
        run: |
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
          test ! -f dist/sitemap.xml
      - name: Keep Cloudflare previews and reserved example domains noindex even with competitor acceptance
        run: |
          SITE_URL=https://prelaunch-finance.example PUBLISH_SEO=true npm run build
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
          test ! -f dist/sitemap.xml
          npm run build
      - name: Verify release scope on a simulated custom HTTPS host (no external publishing)
        run: |
          SITE_URL=https://finance-launch-ci-check.com PUBLISH_SEO=true npm run build
          grep -q 'index,follow' dist/index.html
          grep -q 'sitemap.xml' dist/robots.txt
          grep -q 'tools/qbo-to-csv/' dist/sitemap.xml
          grep -q 'tools/qbo-to-excel/' dist/sitemap.xml
          if grep -q 'tools/quickbooks-csv-formatter/' dist/sitemap.xml; then exit 1; fi
          if grep -q 'tools/csv-to-qbo/' dist/sitemap.xml; then exit 1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('dist/build-manifest.json','utf8'));
          if(m.releaseMode!=='production'||m.realBankEvidenceCases!==0||
             m.targetApplicationImportEvidenceCases!==0||
             m.competitorReadEvidenceCases!==1||
             m.releaseEvidenceScope!=='independent_competitor_generated_synthetic_qbo_read'||
             JSON.stringify(m.approvedIndexableRoutes)!==JSON.stringify(['qbo-to-csv','qbo-to-excel']))
             throw Error('Unexpected SEO evidence or route scope; refuse release.');
          NODE
          npm run build
      - name: Independently validate synthetic XLSX with Python OOXML reader
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {toXLSX} from './src/xlsx.mjs';
          const synthetic=[
            {date:'2026-11-04',description:'=SUM(1,2) & <tag>\r\nsecond',amount:'-0.01',id:'000123'},
            {date:'1900-02-28',description:'Older bank',amount:'9999999999999.99',id:'Z'},
            {date:'1900-03-01',description:'Next day',amount:'0.01',id:''}
          ];
          writeFileSync('/tmp/csv-qbo-synthetic.xlsx',toXLSX(synthetic));
          NODE
          python3 tests/verify_xlsx_ooxml.py /tmp/csv-qbo-synthetic.xlsx
          rm /tmp/csv-qbo-synthetic.xlsx
      - name: Run real Chrome browser file-upload and download acceptance
        run: |
          command -v google-chrome
          npm install --no-save --no-package-lock playwright-core@1.55.0
          npm run test:browser
          node tests/qbo-writer-browser.mjs
      - name: Upload synthetic browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: browser-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 3
